<!DOCTYPE html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Santa 🎄</title>
<style>
:root{--bg:#fbf6ee;--fg:#2a1f1a;--mut:#7a6a60;--card:#ffffff;--line:#e8dccb;--acc:#c0392b;--acc2:#1e7a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--fg:#f5ebdd;--mut:#b3a396;--card:#241c17;--line:#3a2d25;--acc:#e5584a;--acc2:#4fbf86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120f;--fg:#f5ebdd;--mut:#b3a396;--card:#241c17;--line:#3a2d25;--acc:#e5584a;--acc2:#4fbf86;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:440px;text-align:center}
h1{font-size:2rem;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
input{width:100%;font-size:1.1rem;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:center}
button{font-size:1.05rem;font-weight:600;padding:13px 20px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer;margin-top:12px;width:100%}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);width:auto;font-size:.9rem;padding:8px 14px}
button.sm{width:auto;margin:0;padding:6px 12px;font-size:.9rem;background:var(--line);color:var(--fg)}
button:disabled{opacity:.5}
.wheel{font-size:2.2rem;font-weight:800;min-height:3.2rem;display:flex;align-items:center;justify-content:center;margin:18px 0;color:var(--fg);word-break:break-word}
.wheel.spin{color:var(--mut);animation:b .25s infinite alternate}
.wheel.done{color:var(--acc2);animation:pop .5s}
@keyframes b{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.msg{color:var(--acc);min-height:1.3em;margin:10px 0 0;font-size:.95rem}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.foot{margin-top:22px}
.gift{font-size:3rem}
</style>
<style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style></head>
<body>
<main>
<div id="app"></div>
</main>
<script id="state" type="application/json">{"names":["Mami","Rodri","Nico","Vicky","Ine","Mati"],"seed":779}</script>
<script>
const S = JSON.parse(document.getElementById('state').textContent);
const app = document.getElementById('app');
const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function assign(names,seed){
  const r=rng(seed),a=names.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  const m={};a.forEach((n,i)=>{m[n]=a[(i+1)%a.length];});return m;
}
function el(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){ if(k==='class')e.className=props[k]; else if(k.startsWith('on'))e[k]=props[k]; else e.setAttribute(k,props[k]); }
  kids.forEach(k=>e.append(k));return e;
}
function show(...nodes){app.replaceChildren(...nodes);}

function home(){
  const msg=el('p',{class:'msg'});
  const input=el('input',{placeholder:'Tu nombre',autocomplete:'off',enterkeyhint:'go'});
  const wheel=el('div',{class:'wheel'},'🎁');
  const btn=el('button',{},'¡Girar!');
  const card=el('div',{class:'card'},input,btn,msg,wheel);
  let busy=false;
  const go=()=>{
    if(busy)return;
    msg.textContent='';
    if(S.names.length<3){msg.textContent='Aún no está listo el sorteo.';return;}
    const me=S.names.find(n=>norm(n)===norm(input.value));
    if(!me){msg.textContent='No encuentro ese nombre. Revisa cómo está escrito.';return;}
    const target=assign(S.names,S.seed)[me];
    const pool=S.names.filter(n=>n!==me);
    busy=true;btn.disabled=true;input.disabled=true;wheel.className='wheel spin';
    let delay=60,t=0;
    (function tick(){
      if(t>=3200){wheel.textContent=target;wheel.className='wheel done';msg.style.color='var(--acc2)';msg.textContent='¡Ese es tu amigo invisible! 🤫 No se lo digas a nadie.';btn.style.display='none';return;}
      wheel.textContent=pool[Math.floor(Math.random()*pool.length)];
      t+=delay;delay=Math.min(delay*1.12,420);setTimeout(tick,delay);
    })();
  };
  btn.onclick=go;input.onkeydown=e=>{if(e.key==='Enter')go();};
  const adm=el('button',{class:'ghost',onclick:login},'Admin');
  show(el('div',{class:'gift'},'🎄'),el('h1',{},'Secret Santa'),el('p',{class:'sub'},'Escribe tu nombre y gira para saber a quién le regalas.🤫'),card,el('div',{class:'foot'},adm));
}

function login(){
  const input=el('input',{placeholder:'Usuario admin',autocomplete:'off'});
  const msg=el('p',{class:'msg'});
  const ok=()=>{ if(input.value.trim().toLowerCase()==='matiadmin')admin(); else msg.textContent='Usuario incorrecto.'; };
  input.onkeydown=e=>{if(e.key==='Enter')ok();};
  show(el('h1',{},'Admin'),el('div',{class:'card'},input,el('button',{onclick:ok},'Entrar'),msg),el('div',{class:'foot'},el('button',{class:'ghost',onclick:home},'Volver')));
}

function admin(){
  let draft=S.names.slice();
  const list=el('div');
  const msg=el('p',{class:'msg'});
  const input=el('input',{placeholder:'Nombre del participante',autocomplete:'off'});
  function draw(){
    list.replaceChildren(...draft.map((n,i)=>el('div',{class:'row'},el('span',{},n),el('button',{class:'sm',onclick:()=>{draft.splice(i,1);draw();}},'Borrar'))));
    if(!draft.length)list.append(el('p',{class:'sub'},'Sin participantes todavía.'));
  }
  const add=()=>{
    const v=input.value.trim();
    if(!v)return;
    if(draft.some(n=>norm(n)===norm(v))){msg.textContent='Ese nombre ya está.';return;}
    draft.push(v);input.value='';msg.textContent='';draw();
  };
  input.onkeydown=e=>{if(e.key==='Enter')add();};
  const save=async(force)=>{
    msg.style.color='var(--acc)';
    if(draft.length<3){msg.textContent='Se necesitan al menos 3 participantes.';return;}
    const changed=force===true||JSON.stringify(draft)!==JSON.stringify(S.names);
    const state={names:draft,seed:changed?Math.floor(Math.random()*1e9)+1:S.seed};
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    c.querySelector('#app').innerHTML='';
    const html='<!DOCTYPE html>\n'+c.outerHTML;
    try{
      const art=await claude.use('artifact');
      if(!art){msg.textContent='Abre la página desde tu cuenta de Claude para poder guardar.';return;}
      msg.textContent='Guardando…';
      await art.publish(html);
    }catch(e){msg.textContent='No se pudo guardar: solo el creador de la página puede hacerlo.';}
  };
  draw();
  show(el('h1',{},'Admin'),el('p',{class:'sub'},'Agrega o borra participantes. Al guardar con cambios se hace un sorteo nuevo.'),
    el('div',{class:'card'},input,el('button',{onclick:add},'Agregar'),list,el('button',{onclick:save},'Guardar y sortear'),el('button',{class:'ghost',style:'width:100%;margin-top:10px',onclick:()=>save(true)},'Reiniciar sorteo (mismos nombres)'),msg),
    el('div',{class:'foot'},el('button',{class:'ghost',onclick:home},'Salir')));
}
home();
</script>


</body></html>
